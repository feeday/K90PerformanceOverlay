name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk K90PerformanceOverlay-debug.apk
          sha256sum K90PerformanceOverlay-debug.apk > K90PerformanceOverlay-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K90PerformanceOverlay-APK
          path: |
            K90PerformanceOverlay-debug.apk
            K90PerformanceOverlay-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
